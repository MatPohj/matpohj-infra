- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: yes

- name: Set UFW default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow OpenSSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH

# Ports instead of the "Nginx Full" app profile: that profile only exists once
# nginx is installed, and this role runs before the deploy role on a fresh server.
- name: Allow HTTP and HTTPS through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '80'
    - '443'

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Ensure sysadmin user exists and is in sudo group
  ansible.builtin.user:
    name: sysadmin
    state: present
    groups: sudo
    append: yes
    create_home: yes

# sysadmin has no password and SSH password login is disabled below, so without
# this "become: yes" stops working after the first run.
- name: Allow passwordless sudo for sysadmin
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-sysadmin
    content: "sysadmin ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Deploy SSH Key for sysadmin
  ansible.posix.authorized_key:
    user: sysadmin
    state: present
    # This reads your local public key and pushes it to the server
    key: "{{ lookup('file', '../../../id_ed25519.pub') }}"

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

# sshd uses the FIRST value it sees for a keyword. Cloud images often ship
# /etc/ssh/sshd_config.d/50-cloud-init.conf with "PasswordAuthentication yes",
# which is included before the lines above and silently wins. A drop-in that
# sorts first makes the hardening apply regardless.
- name: Check for sshd drop-in directory
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d
  register: sshd_dropin_dir

- name: Enforce SSH hardening via drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # Managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
    owner: root
    group: root
    mode: '0644'
  when: sshd_dropin_dir.stat.isdir | default(false)
  notify: Restart SSH

- name: Verify effective SSH settings
  ansible.builtin.command: /usr/sbin/sshd -T
  register: sshd_effective
  changed_when: false
  failed_when: >-
    'permitrootlogin no' not in sshd_effective.stdout
    or 'passwordauthentication no' not in sshd_effective.stdout
