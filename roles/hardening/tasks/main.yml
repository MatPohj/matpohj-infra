- name: Firewall
  block:
    - name: Ensure UFW is installed
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Set UFW default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Limit OpenSSH through UFW
      community.general.ufw:
        rule: limit
        name: OpenSSH

    - name: Allow Nginx
      community.general.ufw:
        rule: allow
        name: Nginx full

    - name: Enable UFW
      community.general.ufw:
        state: enabled

- name: Users
  block:
    - name: Ensure sysadmin user exists and is in sudo group
      ansible.builtin.user:
        name: sysadmin
        state: present
        groups: sudo
        append: yes
        create_home: yes

    - name: Deploy SSH Key for sysadmin
      ansible.posix.authorized_key:
        user: sysadmin
        state: present
        key: "{{ lookup('file', ssh_public_key_path) }}"

- name: SSH
  block:
    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Ensure SSH public key authentication is enabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Disable SSH challenge response authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?ChallengeResponseAuthentication'
        line: 'ChallengeResponseAuthentication no'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Disable SSH keyboard-interactive authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: 'KbdInteractiveAuthentication no'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Reduce SSH login grace time
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?LoginGraceTime'
        line: 'LoginGraceTime 30'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Reduce SSH max authentication attempts
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 3'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Disallow empty SSH passwords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Restrict SSH access to sysadmin
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowUsers'
        line: 'AllowUsers sysadmin'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

- name: Automatic security updates
  block:
    - name: Ensure unattended-upgrades is installed
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: yes

    - name: Configure periodic unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Ensure unattended-upgrades service is enabled
      ansible.builtin.service:
        name: unattended-upgrades
        state: started
        enabled: yes
