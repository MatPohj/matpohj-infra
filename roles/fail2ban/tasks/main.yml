- name: Install
  block:
    - name: Ensure Fail2ban is installed
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: yes

- name: Checks
  block:
    - name: Check Nginx access log path
      ansible.builtin.stat:
        path: /var/log/nginx/access.log
      register: nginx_access_log

    - name: Check Nginx error log path
      ansible.builtin.stat:
        path: /var/log/nginx/error.log
      register: nginx_error_log

    - name: Set Fail2ban Nginx log availability flags
      ansible.builtin.set_fact:
        fail2ban_nginx_access_log_exists: "{{ nginx_access_log.stat.exists }}"
        fail2ban_nginx_error_log_exists: "{{ nginx_error_log.stat.exists }}"

- name: Configuration
  block:
    - name: Deploy Fail2ban override configuration (jail.local)
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
      notify: Restart Fail2ban

- name: Service
  block:
    - name: Ensure Fail2ban is enabled and running
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: yes
