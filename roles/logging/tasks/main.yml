- name: Install Nginx SIEM log format
  ansible.builtin.template:
    src: nginx-siem-log-format.conf.j2
    dest: /etc/nginx/conf.d/siem_logging.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nginx

- name: Configure centralized log shipping
  when: logging_enabled | bool
  block:
    - name: Require a Loki push URL when logging is enabled
      ansible.builtin.assert:
        that:
          - logging_loki_url | length > 0
        fail_msg: Set logging_loki_url to your Loki endpoint before enabling the logging role.

    - name: Ensure logging prerequisites are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
        update_cache: yes

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Grafana repository signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        owner: root
        group: root
        mode: '0644'

    - name: Configure Grafana APT repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main
        filename: grafana
        state: present
        update_cache: yes

    - name: Install Promtail
      ansible.builtin.apt:
        name: promtail
        state: present
        update_cache: yes

    - name: Allow Promtail to read system logs
      ansible.builtin.user:
        name: promtail
        groups: adm
        append: yes

    - name: Install Promtail configuration
      ansible.builtin.template:
        src: promtail.yml.j2
        dest: /etc/promtail/config.yml
        owner: root
        group: root
        mode: '0644'
      notify: Restart Promtail

    - name: Ensure Promtail is enabled and running
      ansible.builtin.service:
        name: promtail
        state: started
        enabled: yes
