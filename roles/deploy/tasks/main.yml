- name: Install Web Infrastructure packages
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
      - git
    state: present
    update_cache: yes

# On a fresh server the web root does not exist and sysadmin cannot create
# it under the root-owned /var/www, so the git clone below would fail.
- name: Create web root directory
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: sysadmin
    group: www-data
    mode: '0755'

- name: Clone website repository
  ansible.builtin.git:
    repo: "{{ site_repo }}"
    dest: "{{ web_root }}"
    version: "{{ site_version }}"
    force: yes
  become: yes
  become_user: sysadmin
  register: git_clone_result

- name: Set correct permissions for Nginx to read
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    recurse: yes
    owner: sysadmin
    group: www-data
    # Capital 'X' means apply execute bit ONLY to directories, not files
    mode: 'u=rwX,g=rX,o=rX'
  when: git_clone_result.changed

# The full vhost references the Let's Encrypt certificate files, and nginx will
# not start (or reload) with a config that points at files which do not exist.
# So the certificate state decides which vhost is pushed:
#   no certificate yet -> HTTP-only bootstrap vhost, then certbot
#   certificate exists -> full HTTPS vhost
- name: Check if SSL certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: ssl_cert

- name: Push bootstrap HTTP-only Nginx virtual host (no certificate yet)
  ansible.builtin.template:
    src: vhost-http.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}"
    owner: root
    group: root
    mode: '0644'
  when: not ssl_cert.stat.exists
  notify: Restart Nginx

- name: Push full HTTPS Nginx virtual host configuration
  ansible.builtin.template:
    src: vhost-https.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}"
    owner: root
    group: root
    mode: '0644'
  when: ssl_cert.stat.exists
  notify: Restart Nginx

- name: Enable Nginx virtual host
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain }}"
    dest: "/etc/nginx/sites-enabled/{{ domain }}"
    state: link
  notify: Restart Nginx

- name: Remove default Nginx virtual host
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

# certbot needs nginx to serve the bootstrap vhost on port 80 right now, so
# restart here instead of waiting for the handlers at the end of the play.
- name: Apply bootstrap vhost before requesting the certificate
  ansible.builtin.service:
    name: nginx
    state: restarted
  when: not ssl_cert.stat.exists

# Requires DNS for the domain and its aliases to already point at this server.
- name: Obtain Let's Encrypt SSL certificate
  ansible.builtin.command:
    cmd: >-
      certbot --nginx --non-interactive --agree-tos
      {% for name in [domain] + domain_aliases %}-d {{ name }} {% endfor %}
      {{ ('-m ' ~ certbot_email) if certbot_email else '--register-unsafely-without-email' }}
    creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  when: not ssl_cert.stat.exists
